<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Harp Levers" />
  <title>Celtic Harp Levers</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-hover: #1f2630;
      --border: #30363d;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --amber: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.35);
      --lever-down: #6e7681;
      --string-c: #ef4444;
      --string-f: #3b82f6;
      --string-neutral: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 16px;
      user-select: none;
    }

    .app-container {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .title-group h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .title-group p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .lang-toggle {
      display: inline-flex;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.78rem;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .lang-btn.active {
      background: var(--amber);
      color: #0d1117;
    }

    /* Key Selector Grid: 4 columns on desktop and mobile so it stays compact vertically */
    .keys-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .key-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
      min-width: 0;
      transition: border-color 0.15s, background-color 0.15s, transform 0.1s;
    }

    .key-card:hover {
      background: var(--surface-hover);
    }

    .key-card:active {
      transform: scale(0.98);
    }

    .key-card.active {
      border-color: var(--amber);
      background: rgba(245, 158, 11, 0.1);
      box-shadow: 0 0 0 1px var(--amber);
    }

    .key-sig {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--amber);
      letter-spacing: 0.02em;
    }

    .key-major {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .key-minor {
      font-size: 0.74rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Status & Staff Banner */
    .status-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .selected-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .selected-badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--amber);
      font-weight: 700;
    }

    .selected-names {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .selected-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .staff-box {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Harp Strings & Levers Board: strictly fit 7 columns inside 100% viewport width */
    .harp-board {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 4px 12px;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
    }

    .string-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      cursor: pointer;
      padding: 4px 1px;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .string-col:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .lever-state-pill {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      padding: 3px 6px;
      border-radius: 999px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      background: #1c2128;
      color: var(--text-muted);
      text-align: center;
      max-width: 100%;
      transition: all 0.2s ease;
    }

    .string-col.is-up .lever-state-pill {
      background: var(--amber);
      color: #0d1117;
      border-color: var(--amber);
      box-shadow: 0 0 10px var(--amber-glow);
    }

    /* Horizontal Lever Housing + Angled Arm */
    .lever-graphic {
      position: relative;
      width: 100%;
      max-width: 56px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    .lever-housing {
      width: 44px;
      height: 20px;
      border-radius: 999px;
      border: 1.5px solid #484f58;
      background: #12161d;
      position: relative;
      display: flex;
      align-items: center;
    }

    .lever-pin-left {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #6e7681;
      margin-left: 4px;
    }

    .lever-pivot {
      position: absolute;
      left: 20px;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #d97706;
      border: 2px solid #0d1117;
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    .lever-arm {
      position: absolute;
      left: 20px;
      top: 50%;
      width: 22px;
      height: 6px;
      margin-top: -3px;
      border-radius: 999px;
      transform-origin: 0% 50%;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s, box-shadow 0.2s;
      z-index: 2;
      background: var(--lever-down);
      transform: rotate(45deg);
    }

    .string-col.is-up .lever-arm {
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber-glow);
      transform: rotate(-45deg);
    }

    /* Bridge Nut + String */
    .bridge-nut {
      width: 10px;
      height: 8px;
      border-radius: 2px;
      background: #484f58;
      margin-bottom: 2px;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .string-col.is-up .bridge-nut {
      background: var(--amber);
      box-shadow: 0 0 6px var(--amber-glow);
    }

    .harp-string {
      width: 3.5px;
      height: 92px;
      border-radius: 2px;
      transition: opacity 0.2s;
    }

    .string-c { background: var(--string-c); }
    .string-f { background: var(--string-f); }
    .string-n { background: var(--string-neutral); }

    .note-base {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .note-sounding {
      margin-top: 3px;
      font-size: 0.92rem;
      font-weight: 800;
      padding: 3px 4px;
      border-radius: 6px;
      background: #0d1117;
      border: 1px solid var(--border);
      width: 92%;
      max-width: 48px;
      text-align: center;
    }

    .string-col.is-up .note-sounding {
      color: var(--amber);
      border-color: rgba(245, 158, 11, 0.45);
    }

    footer {
      text-align: center;
      font-size: 0.74rem;
      color: var(--text-muted);
      padding-top: 2px;
    }

    /* Mobile narrow-screen scaling (<= 460px) so all 7 columns and 8 keys fit without horizontal overflow */
    @media (max-width: 460px) {
      body {
        padding: 8px 6px 12px;
      }
      .app-container {
        gap: 8px;
      }
      .title-group h1 {
        font-size: 1rem;
      }
      .title-group p {
        font-size: 0.7rem;
      }
      .lang-btn {
        font-size: 0.72rem;
        padding: 4px 10px;
      }
      .keys-grid {
        gap: 4px;
      }
      .key-card {
        padding: 6px 5px;
        border-radius: 8px;
      }
      .key-sig {
        font-size: 0.65rem;
      }
      .key-major {
        font-size: 0.76rem;
      }
      .key-minor {
        font-size: 0.64rem;
      }
      .status-panel {
        padding: 8px 10px;
        gap: 8px;
      }
      .selected-badge {
        font-size: 0.64rem;
      }
      .selected-names {
        font-size: 1rem;
      }
      .selected-sub {
        font-size: 0.74rem;
      }
      .staff-box svg {
        width: 92px;
        height: 58px;
      }
      .harp-board {
        padding: 10px 2px 10px;
        gap: 1px;
      }
      .lever-state-pill {
        font-size: 0.56rem;
        padding: 2px 4px;
        margin-bottom: 6px;
      }
      .lever-graphic {
        height: 36px;
        max-width: 44px;
      }
      .lever-housing {
        width: 36px;
        height: 16px;
      }
      .lever-pin-left {
        width: 4px;
        height: 4px;
        margin-left: 3px;
      }
      .lever-pivot {
        left: 16px;
        width: 8px;
        height: 8px;
      }
      .lever-arm {
        left: 16px;
        width: 18px;
        height: 5px;
        margin-top: -2.5px;
      }
      .harp-string {
        height: 76px;
        width: 3px;
      }
      .note-base {
        font-size: 0.64rem;
        margin-top: 6px;
      }
      .note-sounding {
        font-size: 0.78rem;
        padding: 2px 2px;
      }
    }

    .title-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .version-pill {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(245, 158, 11, 0.15);
    color: var(--amber);
    border: 1px solid rgba(245, 158, 11, 0.4);
    line-height: 1.2;
  }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="title-group">
        <div class="title-row">
          <h1 id="appTitle">Celtic Harp Levers</h1>
          <span class="version-pill">v1.2</span>
        </div>
        <p id="appSubtitle">Base tuning: E♭ Major (all levers down)</p>
      </div>
      
      <div class="lang-toggle" role="group" aria-label="Language and Notation">
        <button class="lang-btn active" id="btnEn" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="btnIt" onclick="setLang('it')">IT</button>
      </div>
    </header>

    <section class="keys-grid" id="keysGrid"></section>

    <section class="status-panel">
      <div class="selected-info">
        <span class="selected-badge" id="sigLabel">3 FLATS (3♭)</span>
        <div class="selected-names" id="majorName">E♭ Major</div>
        <div class="selected-sub" id="minorName">Relative minor: C minor</div>
      </div>
      <div class="staff-box" id="staffBox"></div>
    </section>

    <section class="harp-board" id="harpBoard"></section>

    <footer id="footerHint">Tap a key above or click individual levers to inspect custom tunings.</footer>
  </div>

  <script>
    let currentLang = localStorage.getItem('harp_lang') || 'en';
    // Lever states order: [C, D, E, F, G, A, B] -> false = Down, true = Up
    let levers = [false, false, false, false, false, false, false];

    const STRINGS = [
      { id: 'C', colorClass: 'string-c', enDown: 'C', enUp: 'C♯', itDown: 'Do', itUp: 'Do♯' },
      { id: 'D', colorClass: 'string-n', enDown: 'D', enUp: 'D♯', itDown: 'Re', itUp: 'Re♯' },
      { id: 'E', colorClass: 'string-n', enDown: 'E♭', enUp: 'E', itDown: 'Mi♭', itUp: 'Mi' },
      { id: 'F', colorClass: 'string-f', enDown: 'F', enUp: 'F♯', itDown: 'Fa', itUp: 'Fa♯' },
      { id: 'G', colorClass: 'string-n', enDown: 'G', enUp: 'G♯', itDown: 'Sol', itUp: 'Sol♯' },
      { id: 'A', colorClass: 'string-n', enDown: 'A♭', enUp: 'A', itDown: 'La♭', itUp: 'La' },
      { id: 'B', colorClass: 'string-n', enDown: 'B♭', enUp: 'B', itDown: 'Si♭', itUp: 'Si' }
    ];

    const KEYS = [
      {
        sigShort: '3♭',
        enSig: '3 FLATS (3♭)', itSig: '3 BEMOLLI (3♭)',
        enMaj: 'E♭ Major', itMaj: 'Mi♭ Maggiore',
        enMin: 'C minor', itMin: 'Do minore',
        levers: [false, false, false, false, false, false, false],
        type: 'flat', count: 3
      },
      {
        sigShort: '2♭',
        enSig: '2 FLATS (2♭)', itSig: '2 BEMOLLI (2♭)',
        enMaj: 'B♭ Major', itMaj: 'Si♭ Maggiore',
        enMin: 'G minor', itMin: 'Sol minore',
        levers: [false, false, false, false, false, true, false],
        type: 'flat', count: 2
      },
      {
        sigShort: '1♭',
        enSig: '1 FLAT (1♭)', itSig: '1 BEMOLLE (1♭)',
        enMaj: 'F Major', itMaj: 'Fa Maggiore',
        enMin: 'D minor', itMin: 'Re minore',
        levers: [false, false, true, false, false, true, false],
        type: 'flat', count: 1
      },
      {
        sigShort: '0',
        enSig: 'NATURAL (0)', itSig: 'NATURALE (0)',
        enMaj: 'C Major', itMaj: 'Do Maggiore',
        enMin: 'A minor', itMin: 'La minore',
        levers: [false, false, true, false, false, true, true],
        type: 'none', count: 0
      },
      {
        sigShort: '1♯',
        enSig: '1 SHARP (1♯)', itSig: '1 DIESIS (1♯)',
        enMaj: 'G Major', itMaj: 'Sol Maggiore',
        enMin: 'E minor', itMin: 'Mi minore',
        levers: [false, false, true, true, false, true, true],
        type: 'sharp', count: 1
      },
      {
        sigShort: '2♯',
        enSig: '2 SHARPS (2♯)', itSig: '2 DIESIS (2♯)',
        enMaj: 'D Major', itMaj: 'Re Maggiore',
        enMin: 'B minor', itMin: 'Si minore',
        levers: [true, false, true, true, false, true, true],
        type: 'sharp', count: 2
      },
      {
        sigShort: '3♯',
        enSig: '3 SHARPS (3♯)', itSig: '3 DIESIS (3♯)',
        enMaj: 'A Major', itMaj: 'La Maggiore',
        enMin: 'F♯ minor', itMin: 'Fa♯ minore',
        levers: [true, false, true, true, true, true, true],
        type: 'sharp', count: 3
      },
      {
        sigShort: '4♯',
        enSig: '4 SHARPS (4♯)', itSig: '4 DIESIS (4♯)',
        enMaj: 'E Major', itMaj: 'Mi Maggiore',
        enMin: 'C♯ minor', itMin: 'Do♯ minore',
        levers: [true, true, true, true, true, true, true],
        type: 'sharp', count: 4
      }
    ];

    const UI_TEXT = {
      en: {
        title: 'Celtic Harp Levers',
        subtitle: 'Base tuning: E♭ Major (all levers down)',
        relMinor: 'Relative minor:',
        up: 'UP',
        down: 'DOWN',
        customSig: 'CUSTOM / MODAL',
        customMaj: 'Custom Lever Setup',
        customMin: 'Manual lever configuration',
        footer: 'Select a key above or tap any lever to customize.'
      },
      it: {
        title: 'Levette Arpa Celtica',
        subtitle: 'Accordatura base: Mi♭ Maggiore (tutte giù)',
        relMinor: 'Relativa minore:',
        up: 'SU',
        down: 'GIÙ',
        customSig: 'PERSONALIZZATA / MODALE',
        customMaj: 'Configurazione Manuale',
        customMin: 'Posizione levette personalizzata',
        footer: 'Seleziona una tonalità o tocca le singole levette.'
      }
    };

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('harp_lang', lang);
      document.documentElement.lang = lang;
      document.getElementById('btnEn').classList.toggle('active', lang === 'en');
      document.getElementById('btnIt').classList.toggle('active', lang === 'it');
      renderAll();
    }

    function selectPreset(index) {
      levers = [...KEYS[index].levers];
      renderAll();
    }

    function toggleLever(index) {
      levers[index] = !levers[index];
      renderAll();
    }

    function findMatchingKey() {
      return KEYS.find(k => k.levers.every((val, idx) => val === levers[idx])) || null;
    }

    function renderStaffSVG(matchedKey) {
      const flatY = [38, 26, 42];
      const sharpY = [22, 34, 18, 30];
      let accidentalsSVG = '';

      if (matchedKey) {
        if (matchedKey.type === 'flat') {
          for (let i = 0; i < matchedKey.count; i++) {
            const x = 44 + i * 11;
            const y = flatY[i];
            accidentalsSVG += `<text x="${x}" y="${y + 5}" fill="#f59e0b" font-size="18" font-family="serif" font-weight="bold">♭</text>`;
          }
        } else if (matchedKey.type === 'sharp') {
          for (let i = 0; i < matchedKey.count; i++) {
            const x = 44 + i * 11;
            const y = sharpY[i];
            accidentalsSVG += `<text x="${x}" y="${y + 5}" fill="#f59e0b" font-size="17" font-family="serif" font-weight="bold">♯</text>`;
          }
        }
      } else {
        accidentalsSVG = `<text x="52" y="42" fill="#8b949e" font-size="13" font-family="sans-serif">—</text>`;
      }

      return `
        <svg width="112" height="72" viewBox="0 0 112 72" aria-hidden="true">
          <line x1="8" y1="22" x2="104" y2="22" stroke="#484f58" stroke-width="1.2"/>
          <line x1="8" y1="30" x2="104" y2="30" stroke="#484f58" stroke-width="1.2"/>
          <line x1="8" y1="38" x2="104" y2="38" stroke="#484f58" stroke-width="1.2"/>
          <line x1="8" y1="46" x2="104" y2="46" stroke="#484f58" stroke-width="1.2"/>
          <line x1="8" y1="54" x2="104" y2="54" stroke="#484f58" stroke-width="1.2"/>
          <text x="12" y="51" fill="#e2e8f0" font-size="44" font-family="serif">𝄞</text>
          ${accidentalsSVG}
        </svg>
      `;
    }

    function renderAll() {
      const t = UI_TEXT[currentLang];
      document.getElementById('appTitle').textContent = t.title;
      document.getElementById('appSubtitle').textContent = t.subtitle;
      document.getElementById('footerHint').textContent = t.footer;

      const matchedKey = findMatchingKey();

      const keysGrid = document.getElementById('keysGrid');
      keysGrid.innerHTML = KEYS.map((k, idx) => {
        const isActive = matchedKey === k;
        const maj = currentLang === 'en' ? k.enMaj : k.itMaj;
        const min = currentLang === 'en' ? k.enMin : k.itMin;
        return `
          <button class="key-card ${isActive ? 'active' : ''}" onclick="selectPreset(${idx})">
            <span class="key-sig">${k.sigShort}</span>
            <span class="key-major">${maj}</span>
            <span class="key-minor">${min}</span>
          </button>
        `;
      }).join('');

      if (matchedKey) {
        document.getElementById('sigLabel').textContent = currentLang === 'en' ? matchedKey.enSig : matchedKey.itSig;
        document.getElementById('majorName').textContent = currentLang === 'en' ? matchedKey.enMaj : matchedKey.itMaj;
        const minText = currentLang === 'en' ? matchedKey.enMin : matchedKey.itMin;
        document.getElementById('minorName').textContent = `${t.relMinor} ${minText}`;
      } else {
        document.getElementById('sigLabel').textContent = t.customSig;
        document.getElementById('majorName').textContent = t.customMaj;
        document.getElementById('minorName').textContent = t.customMin;
      }
      document.getElementById('staffBox').innerHTML = renderStaffSVG(matchedKey);

      const board = document.getElementById('harpBoard');
      board.innerHTML = STRINGS.map((s, idx) => {
        const isUp = levers[idx];
        const stateText = isUp ? t.up : t.down;
        const baseNote = currentLang === 'en' ? s.enDown : s.itDown;
        const soundingNote = isUp
          ? (currentLang === 'en' ? s.enUp : s.itUp)
          : baseNote;

        return `
          <div class="string-col ${isUp ? 'is-up' : ''}" onclick="toggleLever(${idx})" role="button" tabindex="0" aria-pressed="${isUp}">
            <div class="lever-state-pill">${stateText}</div>
            <div class="lever-graphic">
              <div class="lever-housing">
                <span class="lever-pin-left"></span>
                <span class="lever-pivot"></span>
                <span class="lever-arm"></span>
              </div>
            </div>
            <div class="bridge-nut"></div>
            <div class="harp-string ${s.colorClass}"></div>
            <div class="note-base">${baseNote}</div>
            <div class="note-sounding">${soundingNote}</div>
          </div>
        `;
      }).join('');
    }

    setLang(currentLang);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
